<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me | Personal Profile</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .profile-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 3px solid var(--primary);
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .title {
      font-size: 1rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s, transform 0.1s;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    .social-btn.instagram:hover {
      background-color: #e1306c;
      color: #ffffff;
      border-color: #e1306c;
    }

    .social-btn.linkedin:hover {
      background-color: #0a66c2;
      color: #ffffff;
      border-color: #0a66c2;
    }

    .social-btn.facebook:hover {
      background-color: #1877f2;
      color: #ffffff;
      border-color: #1877f2;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="source/logo.jpg" alt="Profile Picture" class="avatar">
    
    <h1 class="name">Vaishnavi Tripathi</h1>
    <p class="title">ayurvadic doctor</p>
    
    <p class="bio">
      Hello! I'm passionate about learning medicin and help as many people as possible
    </p>

    <div class="social-links">
      <a href="https://instagram.com/yourhandle" target="_blank" class="social-btn instagram">
        Instagram
      </a>
      <a href="https://linkedin.com/in/yourprofile" target="_blank" class="social-btn linkedin">
        LinkedIn
      </a>
      <a href="https://facebook.com/yourprofile" target="_blank" class="social-btn facebook">
        Facebook
      </a>
    </div>
  </div>

</body>
</html>
